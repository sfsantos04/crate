name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Mostrar toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers

      - name: XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto
        run: xcodegen generate

      - name: Compilar (sem assinatura)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Sonda.xcodeproj \
            -scheme Sonda \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/Sonda.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Empacotar IPA
        run: |
          set -euo pipefail
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Sonda.app out/Payload/
          cd out
          zip -qry ../Crate-unsigned.ipa Payload
          cd ..
          ls -lh Crate-unsigned.ipa
          shasum -a 256 Crate-unsigned.ipa | tee Crate-unsigned.ipa.sha256

      - name: Upload do IPA
        uses: actions/upload-artifact@v4
        with:
          name: Crate-unsigned-ipa
          path: |
            Crate-unsigned.ipa
            Crate-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publicar release com o IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "build-${{ github.run_number }}" \
            Crate-unsigned.ipa \
            Crate-unsigned.ipa.sha256 \
            --title "Sonda build ${{ github.run_number }}" \
            --notes "IPA sem assinatura gerado no CI. Instale com SideStore, AltStore ou Sideloadly."

      - name: Upload do log (só em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sonda-build-logs
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/Sonda.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar log da falha como release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/build.log" build.log
          gh release create "log-${{ github.run_number }}" build.log \
            --title "Log da falha build ${{ github.run_number }}" \
            --notes "Log de compilação do run que falhou." || true
